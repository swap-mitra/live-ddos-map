[project]
name = "live-ddos-map-backend"
version = "0.1.0"
description = "FastAPI backend for the live DDoS map data pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.3,<3.0",
  "httpx>=0.27,<1.0",
  "aiosqlite>=0.20,<1.0",
  "apscheduler>=3.10,<4.0",
  "geoip2>=4.8,<5.0",
  "joblib>=1.4,<2.0",
  "scikit-learn>=1.5,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5.0,<6",
  "ruff>=0.5,<1"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
